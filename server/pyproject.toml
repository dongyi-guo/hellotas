[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hellotas-api"
version = "1.0.0"
description = "Community API for Tasmania Welcome: accounts, event buddies, walls, opportunities, checklist, digest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "requests>=2.32",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hellotas-api = "hellotas_api.cli:main"

[tool.setuptools.packages.find]
include = ["hellotas_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
