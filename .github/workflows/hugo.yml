name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also started by collect-events.yml after it publishes directly

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Optional: a Discord channel webhook (Server settings > Integrations > Webhooks). When set, events that are
      # new since the last deploy are announced there (upstream issue #63).
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Build
        run: hugo --minify --baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Keep the events list from the last deploy
        if: env.DISCORD_WEBHOOK_URL != ''
        run: git show origin/gh-pages:happening/index.json > "$RUNNER_TEMP/old-events.json" 2>/dev/null || echo "No earlier events list."

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages

      - name: Announce new events on Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          pip install ./collector
          hellotas-collect discord --old "$RUNNER_TEMP/old-events.json" --new public/happening/index.json
