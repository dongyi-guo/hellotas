name: API container image

# Builds server/ into a container image on every change to main, and publishes it as
# ghcr.io/<owner>/hellotas-api (tags: latest and the commit). Hosts can then deploy the image instead of building
# it themselves. On pull requests it only checks that the image builds.

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/api-image.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/api-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hellotas-api" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
