name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - run: pip install './collector[test]'
      - run: pytest collector -q

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hellotas
          POSTGRES_PASSWORD: hellotas
          POSTGRES_DB: hellotas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hellotas" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install './server[test]'
      - name: Tests on SQLite
        run: pytest server -q
      - name: Tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://hellotas:hellotas@localhost:5432/hellotas_test
        run: pytest server -q

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true
      - name: Build
        run: hugo --minify --panicOnWarning
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - name: Check the calendar and JSON feeds
        run: |
          pip install ./collector
          hellotas-collect check-site public
