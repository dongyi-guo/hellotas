    content:
      en: "Now we are celebrating our four highest honours – recognising outstanding research, academic excellence and our 2026 ICT Graduate of the Year!"
      zh: "现在我们来庆祝当晚的四项最高荣誉——表彰杰出研究、学业卓越，以及我们的 2026 年度 ICT 毕业生！"
      ne: "अब हामी हाम्रा चार सर्वोच्च सम्मान मनाउँदैछौं – उत्कृष्ट अनुसन्धान, शैक्षिक उत्कृष्टता र हाम्रो 2026 ICT Graduate of the Year!"
    summary:
      en: "Nicole presents the night's four highest honours: the Research Excellence Award to PhD graduate Riseul Ryu, the Bachelor of ICT Academic Excellence Award to Tim Cox, the Master of IT and Systems award to Gothami Jayasingha, and the 2026 ICT Graduate of the Year to Gazi MD Wasi-UL Hoque Eusha, with the finalists for each."
      zh: "Nicole 公布了当晚四项最高荣誉：研究卓越奖颁给博士毕业生 Riseul Ryu，ICT 学士学业卓越奖颁给 Tim Cox，信息技术与系统硕士学业卓越奖颁给 Gothami Jayasingha，2026 年度 ICT 毕业生颁给 Gazi MD Wasi-UL Hoque Eusha，并列出了各奖项的决赛入围者。"
      ne: "Nicole ले रातका चार सर्वोच्च सम्मान प्रस्तुत गर्नुहुन्छ: Research Excellence Award PhD स्नातक Riseul Ryu लाई, Bachelor of ICT Academic Excellence Award Tim Cox लाई, Master of IT and Systems पुरस्कार Gothami Jayasingha लाई, र 2026 ICT Graduate of the Year Gazi MD Wasi-UL Hoque Eusha लाई, साथै हरेकका फाइनलिस्टहरू।"
    url: "https://www.linkedin.com/posts/nicole-herbert0_celebrating-the-best-of-the-best-our-2026-ugcPost-7525855771184619520-DQZ6/"
