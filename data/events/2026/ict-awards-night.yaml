    content:
      en: "Throughout the evening, we presented over 100 Unit Excellence certificates, recognising students who achieved the highest academic result in their unit in 2026."
      zh: "当晚我们颁发了 100 多份单元卓越证书，表彰在 2026 年各自单元中取得最高成绩的学生。"
      ne: "साँझभरि हामीले 100 भन्दा बढी Unit Excellence प्रमाणपत्र प्रदान गर्‍यौं, जसले 2026 मा आफ्नो युनिटमा सबैभन्दा उच्च नतिजा ल्याउने विद्यार्थीहरूलाई सम्मान गर्छ।"
    summary:
      en: "Nicole's last post from the night recognises the more than 100 Unit Excellence certificates, given to the top student in each ICT unit, in classes of around 30 to more than 300. It names the students who topped several units, including Tim Cox, Hang Li, Bronson Billing, Yixi Chen and Nusaiba Nizam, and thanks the sponsors and presenters."
      zh: "Nicole 关于当晚的最后一篇帖子，表彰了 100 多份单元卓越证书的获得者，他们是各 ICT 单元中成绩最高的学生，而这些单元的人数从约 30 人到 300 多人不等。帖子还点名了在多个单元中名列第一的学生，包括 Tim Cox、Hang Li、Bronson Billing、Yixi Chen 和 Nusaiba Nizam，并感谢了赞助方和颁奖嘉宾。"
      ne: "रातबारे Nicole को अन्तिम पोस्टले 100 भन्दा बढी Unit Excellence प्रमाणपत्रलाई सम्मान गर्छ, जुन करिब 30 देखि 300 भन्दा बढी विद्यार्थी भएका कक्षामा हरेक ICT युनिटका शीर्ष विद्यार्थीलाई दिइएको थियो। पोस्टले धेरै युनिटमा शीर्ष हुने विद्यार्थीहरूको नाम लिन्छ, जस्तै Tim Cox, Hang Li, Bronson Billing, Yixi Chen र Nusaiba Nizam, र प्रायोजक तथा प्रस्तुतकर्ताहरूलाई धन्यवाद दिन्छ।"
    url: "https://www.linkedin.com/posts/nicole-herbert0_celebrating-academic-excellence-our-2026-ugcPost-7525865082279317505-gmaL/"
  - name: "Nicole Herbert"
    role:
      en: "Professor, Head of School of ICT, University of Tasmania"
      zh: "教授，University of Tasmania School of ICT 院长"
      ne: "प्राध्यापक, School of ICT प्रमुख, University of Tasmania"
    content:
      en: "Because university isn't just about what you learn, it's about what you do with that learning, the people you support, and the professional you become."
      zh: "因为大学不只是学到了什么，更在于你如何运用所学、帮助了哪些人，以及成为怎样的专业人士。"
      ne: "किनकि विश्वविद्यालय तपाईंले के सिक्नुहुन्छ भन्ने मात्र होइन, त्यो सिकाइले के गर्नुहुन्छ, कसलाई सहयोग गर्नुहुन्छ र कस्तो पेसाकर्मी बन्नुहुन्छ भन्ने पनि हो।"
    summary:
      en: "A week before the night, Nicole invites industry colleagues, alumni, students and graduates to the first ICT Awards Night on Monday 9 November, in Hobart and Launceston. It is a chance to meet emerging ICT talent, and a student-led end-of-semester party follows at the Hobart venue."
      zh: "颁奖之夜前一周，Nicole 邀请业界同仁、校友、在校生和毕业生参加 11 月 9 日（星期一）在霍巴特和朗塞斯顿举行的首届 ICT 颁奖之夜。这是结识新一代 ICT 人才的好机会，颁奖结束后霍巴特会场还有学生组织的期末派对。"
      ne: "रातभन्दा एक हप्ताअघि, Nicole ले उद्योगका सहकर्मी, पूर्वविद्यार्थी, विद्यार्थी र स्नातकहरूलाई सोमबार 9 नोभेम्बरमा होबार्ट र लन्सेस्टनमा हुने पहिलो ICT Awards Night मा निम्तो दिनुहुन्छ। यो उदीयमान ICT प्रतिभालाई भेट्ने मौका हो, र होबार्टको स्थलमा विद्यार्थीहरूले आयोजना गर्ने सेमेस्टर अन्त्यको पार्टी पनि हुन्छ।"
    url: "https://www.linkedin.com/posts/nicole-herbert0_come-and-meet-the-best-and-brightest-of-tasmanias-share-7523511537911652352-xRXT/"
  - name: "Gazi MD Wasi-UL Hoque Eusha"
