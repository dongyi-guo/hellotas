    content:
      en: "Among the awards presented were 10 Academic Excellence Awards, recognising the highest-achieving 2026 graduates across our Bachelor of Information and Communication Technology (BICT) majors and Master of Information Technology and Systems (MITS) specialisations."
      zh: "当晚颁发的奖项中有 10 个学业卓越奖，表彰 2026 年 ICT 学士（BICT）各专业方向和信息技术与系统硕士（MITS）各专业方向中成绩最优异的毕业生。"
      ne: "प्रदान गरिएका पुरस्कारमध्ये 10 वटा Academic Excellence Award थिए, जसले Bachelor of Information and Communication Technology (BICT) का मेजर र Master of Information Technology and Systems (MITS) का स्पेसियलाइजेसनहरूमा 2026 का सबैभन्दा उत्कृष्ट स्नातकहरूलाई सम्मान गर्छ।"
    summary:
      en: "Nicole announces the ten Academic Excellence Awards for the top 2026 graduate in each Bachelor of ICT major and Master of IT and Systems specialisation, from Syed Ali Hossain in Software Development to Yixi Chen in Systems Analysis. Nicole thanks the industry sponsors, including Skills Solutions Australia, TasmaNet, Data#3, Intuit Technologies, ISW, Echoview and Red Apple IT."
      zh: "Nicole 公布了十个学业卓越奖，颁给 2026 年 ICT 学士各专业方向和信息技术与系统硕士各专业方向的第一名毕业生，从软件开发方向的 Syed Ali Hossain 到系统分析方向的 Yixi Chen。Nicole 感谢了 Skills Solutions Australia、TasmaNet、Data#3、Intuit Technologies、ISW、Echoview 和 Red Apple IT 等行业赞助方。"
      ne: "Nicole ले Bachelor of ICT का हरेक मेजर र Master of IT and Systems का हरेक स्पेसियलाइजेसनका 2026 का शीर्ष स्नातकलाई दिइने दस Academic Excellence Award घोषणा गर्नुहुन्छ, Software Development मा Syed Ali Hossain देखि Systems Analysis मा Yixi Chen सम्म। Nicole ले Skills Solutions Australia, TasmaNet, Data#3, Intuit Technologies, ISW, Echoview र Red Apple IT लगायत उद्योग प्रायोजकहरूलाई धन्यवाद दिनुहुन्छ।"
    url: "https://www.linkedin.com/posts/nicole-herbert0_celebrating-academic-excellence-in-ict-ugcPost-7525787184596033536-QOl_/"
  - name: "Nicole Herbert"
    role:
      en: "Professor, Head of School of ICT, University of Tasmania"
      zh: "教授，University of Tasmania School of ICT 院长"
      ne: "प्राध्यापक, School of ICT प्रमुख, University of Tasmania"
    images:
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-choice-1.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-choice-2.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-choice-3.jpg"
      - "/images/events/2026/ict-awards-night/award-hosna-ara-begum.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-choice-5.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-choice-6.jpg"
    content:
      en: "These awards are a little different! They were shaped by our students to recognise the people and contributions that make a real difference to their learning experience and our ICT community."
      zh: "这些奖项有点不一样！它们由学生参与设计，用来表彰那些真正改善学习体验、让 ICT 社区更好的人和贡献。"
      ne: "यी पुरस्कार अलि फरक छन्! यिनलाई हाम्रा विद्यार्थीहरूले नै आकार दिएका हुन्, ताकि उनीहरूको सिकाइ अनुभव र हाम्रो ICT समुदायमा साँच्चै फरक पार्ने मानिस र योगदानलाई सम्मान गर्न सकियोस्।"
    summary:
      en: "Nicole introduces the five Students' Choice Awards: the Inquisitor (Yixi Chen), Eagle Eye (Hang Li) and Team Leadership (Hosna Ara Begum) awards for students, and two staff awards, for Tony Gray and Gothami Jayasingha. Forgotten Isle Consulting sponsored the student awards, and students Rakhitha Dassanayake and Taylah Stewart gave addresses in Launceston and Hobart."
      zh: "Nicole 介绍了五个学生之选奖：颁给学生的提问者奖（Yixi Chen）、鹰眼奖（Hang Li）和团队领导力奖（Hosna Ara Begum），以及两个教职员工奖，分别颁给 Tony Gray 和 Gothami Jayasingha。学生奖项由 Forgotten Isle Consulting 赞助，学生 Rakhitha Dassanayake 和 Taylah Stewart 分别在朗塞斯顿和霍巴特致辞。"
      ne: "Nicole ले पाँच Students' Choice Award को परिचय दिनुहुन्छ: विद्यार्थीका लागि Inquisitor (Yixi Chen), Eagle Eye (Hang Li) र Team Leadership (Hosna Ara Begum) पुरस्कार, र कर्मचारीका लागि दुई पुरस्कार, Tony Gray र Gothami Jayasingha लाई। विद्यार्थी पुरस्कारहरू Forgotten Isle Consulting ले प्रायोजन गरेको थियो, र विद्यार्थी Rakhitha Dassanayake र Taylah Stewart ले लन्सेस्टन र होबार्टमा मन्तव्य दिनुभयो।"
    url: "https://www.linkedin.com/posts/nicole-herbert0_celebrating-our-students-choices-the-awards-ugcPost-7525793562945392640-uv1z/"
  - name: "Nicole Herbert"
    role:
      en: "Professor, Head of School of ICT, University of Tasmania"
      zh: "教授，University of Tasmania School of ICT 院长"
      ne: "प्राध्यापक, School of ICT प्रमुख, University of Tasmania"
    images:
      - "/images/events/2026/ict-awards-night/award-chris-thiraphadungphong.jpg"
      - "/images/events/2026/ict-awards-night/award-amc-mate.jpg"
      - "/images/events/2026/ict-awards-night/award-billal-hossain-shishir.jpg"
      - "/images/events/2026/ict-awards-night/award-binsight.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-projects-5.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-projects-6.jpg"
      - "/images/events/2026/ict-awards-night/linkedin-nicole-herbert-projects-7.jpg"
    content:
      en: "We received 27 nominations for our Outstanding ICT Project Awards, showcasing an impressive range of technical skills, creativity, innovation and real-world problem-solving."
      zh: "我们的杰出 ICT 项目奖共收到 27 项提名，展现了令人印象深刻的技术能力、创造力、创新和解决实际问题的能力。"
      ne: "हाम्रो Outstanding ICT Project Award का लागि 27 वटा मनोनयन आए, जसले प्राविधिक सीप, सिर्जनशीलता, नवप्रवर्तन र वास्तविक समस्या समाधानको प्रभावशाली दायरा देखाए।"
    summary:
      en: "Nicole celebrates the Outstanding ICT Project Awards, chosen from 27 nominations: Brie Healy for game development, Chris Thiraphadungphong for business process improvement, Billal Hossain Shishir for a professional portfolio, and the AMC Mate and BinSight teams. A further award for the best project from the end-of-semester Showcase went to Veteran's Phone, presented by Chris Jackson from Data#3."
      zh: "Nicole 祝贺从 27 项提名中选出的杰出 ICT 项目奖得主：游戏开发方向的 Brie Healy、业务流程改进方向的 Chris Thiraphadungphong、专业作品集方向的 Billal Hossain Shishir，以及 AMC Mate 和 BinSight 两个团队。另一个奖项颁给期末 ICT 学生展的最佳项目 Veteran's Phone，由 Data#3 的 Chris Jackson 颁发。"
      ne: "Nicole ले 27 मनोनयनबाट छानिएका Outstanding ICT Project Award विजेताहरूलाई बधाई दिनुहुन्छ: गेम विकासमा Brie Healy, व्यवसाय प्रक्रिया सुधारमा Chris Thiraphadungphong, प्रोफेसनल पोर्टफोलियोमा Billal Hossain Shishir, र AMC Mate तथा BinSight टिम। सेमेस्टर अन्त्यको Showcase को उत्कृष्ट परियोजनाको थप पुरस्कार Veteran's Phone ले पायो, जुन Data#3 का Chris Jackson ले हस्तान्तरण गर्नुभयो।"
    url: "https://www.linkedin.com/posts/nicole-herbert0_celebrating-outstanding-ict-student-projects-ugcPost-7525798492011741184-bGMC/"
  - name: "Nicole Herbert"
    role:
      en: "Professor, Head of School of ICT, University of Tasmania"
      zh: "教授，University of Tasmania School of ICT 院长"
      ne: "प्राध्यापक, School of ICT प्रमुख, University of Tasmania"
    images:
      - "/images/events/2026/ict-awards-night/award-bronson-billing.jpg"
      - "/images/events/2026/ict-awards-night/award-abir-hossain-khondoker.jpg"
      - "/images/events/2026/ict-awards-night/award-chhunly-chhek.jpg"
      - "/images/events/2026/ict-awards-night/award-farahbi-ishrak.jpg"
      - "/images/events/2026/ict-awards-night/award-taylah-stewart.jpg"
    content:
      en: "One of the things that made this event particularly special was that the idea for the Awards Night came from our students."
      zh: "这次活动特别有意义的一点是：举办颁奖之夜的想法来自我们的学生。"
      ne: "यो कार्यक्रमलाई विशेष बनाउने कुरामध्ये एउटा के हो भने Awards Night को विचार हाम्रा विद्यार्थीहरूबाटै आएको थियो।"
    summary:
      en: "Nicole explains that students came up with the idea for the Awards Night and helped shape these five awards for leadership, community spirit, industry engagement, personal growth and emerging talent. The winners were Chhunly Chhek, Abir Hossain Khondoker, Bronson Billing, Taylah Stewart and Md. Farahbi Ishrak, with sponsors Secret Lab, TasICT, ACS Tasmania and The Project Lab."
      zh: "Nicole 介绍说，举办颁奖之夜的想法来自学生，学生也参与设计了这五个奖项，分别表彰领导力、社区精神、行业参与、个人成长和新星潜力。获奖者是 Chhunly Chhek、Abir Hossain Khondoker、Bronson Billing、Taylah Stewart 和 Md. Farahbi Ishrak，赞助方为 Secret Lab、TasICT、ACS Tasmania 和 The Project Lab。"
      ne: "Nicole भन्नुहुन्छ कि Awards Night को विचार विद्यार्थीहरूकै थियो, र नेतृत्व, सामुदायिक भावना, उद्योग संलग्नता, व्यक्तिगत प्रगति र उदीयमान प्रतिभाका यी पाँच पुरस्कार बनाउन पनि उनीहरूले सघाए। विजेताहरू Chhunly Chhek, Abir Hossain Khondoker, Bronson Billing, Taylah Stewart र Md. Farahbi Ishrak हुनुहुन्छ, र प्रायोजक Secret Lab, TasICT, ACS Tasmania र The Project Lab थिए।"
    url: "https://www.linkedin.com/posts/nicole-herbert0_celebrating-more-than-academic-excellence-ugcPost-7525848564518797312-uwg5/"
  - name: "Nicole Herbert"
