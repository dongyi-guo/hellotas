about:
  en:
    - "The University of Tasmania (UTAS) School of ICT held its inaugural ICT Awards Night on Monday 9 November 2026, with more than 150 students, graduates, industry partners and staff joining across Hobart and Launceston. The idea for the evening came from students, who were also invited to help shape the awards by telling the School which achievements and contributions deserved recognition. Every award presented on the night was sponsored by industry partners."
    - "Around 30 awards and around 100 Unit Excellence certificates were presented. The certificates recognised students who achieved the highest academic result in their unit in 2026, in units ranging from first-year undergraduate subjects to final-year Master’s units. The awards also celebrated students who create amazing projects, engage with industry, demonstrate leadership, volunteer, support their classmates and make the School a better place to study and belong, including 27 nominations for the Outstanding ICT Project Awards."
    - "The four highest honours recognised research excellence, academic excellence in the Bachelor of Information and Communication Technology and the Master of Information Technology and Systems, and the 2026 ICT Graduate of the Year, awarded to Gazi MD Wasi-UL Hoque Eusha. The Students’ Choice Awards, shaped by students themselves, included the Inquisitor Award for the student who asks the questions everyone else is secretly hoping someone will ask, and the ICT Community Spirit Award went to Chhunly Chhek. Two students, Rakhitha Dassanayake in Launceston and Taylah Stewart in Hobart, also shared student addresses during the evening."
  zh:
    - "University of Tasmania（UTAS）School of ICT 于 2026 年 11 月 9 日（星期一）举办了首届 ICT 颁奖之夜，霍巴特和朗塞斯顿两地共有 150 多名学生、毕业生、行业伙伴和教职员参加。举办这场晚会的想法来自学生，学院还邀请学生参与设计奖项，告诉学院哪些成就和贡献值得表彰。当晚颁发的每一个奖项都由行业伙伴赞助。"
    - "当晚共颁发约 30 个奖项和约 100 份单元卓越证书（Unit Excellence）。证书授予 2026 年在各自单元中取得最高成绩的学生，单元从本科一年级课程到硕士最后一年的课程都有。奖项还表彰了做出出色项目、积极对接行业、展现领导力、参与志愿服务、帮助同学，并让学院成为更好的学习和归属之地的学生；其中“杰出 ICT 项目奖”共收到 27 项提名。"
    - "四项最高荣誉分别表彰研究卓越、ICT 学士（Bachelor of Information and Communication Technology）和信息技术与系统硕士（Master of Information Technology and Systems）的学业卓越，以及 2026 年度 ICT 毕业生，最后一项由 Gazi MD Wasi-UL Hoque Eusha 获得。由学生自己参与设计的“学生之选”奖中，有一个“提问者奖”（Inquisitor Award），颁给那位总是问出大家心里都想问的问题的同学；ICT 社区精神奖由 Chhunly Chhek 获得。当晚还有两位学生发表了学生致辞：朗塞斯顿的 Rakhitha Dassanayake 和霍巴特的 Taylah Stewart。"
  ne:
    - "University of Tasmania (UTAS) को School of ICT ले सोमबार 9 नोभेम्बर 2026 मा पहिलो ICT Awards Night आयोजना गर्‍यो, जसमा होबार्ट र लन्सेस्टनबाट 150 भन्दा बढी विद्यार्थी, स्नातक, उद्योग साझेदार र कर्मचारी सहभागी भए। यो साँझको विचार विद्यार्थीहरूबाटै आएको थियो, र कुन उपलब्धि र योगदानलाई सम्मान गर्नुपर्छ भनेर बताउँदै पुरस्कारहरू तय गर्न पनि विद्यार्थीहरूलाई आमन्त्रण गरिएको थियो। रातमा दिइएका सबै पुरस्कार उद्योग साझेदारहरूले प्रायोजन गरेका थिए।"
    - "करिब 30 पुरस्कार र करिब 100 Unit Excellence प्रमाणपत्र प्रदान गरिए। प्रमाणपत्रहरूले 2026 मा आफ्नो युनिटमा सबैभन्दा उच्च नतिजा ल्याउने विद्यार्थीलाई सम्मान गरे, जसमा स्नातकको पहिलो वर्षदेखि स्नातकोत्तरको अन्तिम वर्षसम्मका युनिट थिए। पुरस्कारहरूले उत्कृष्ट परियोजना बनाउने, उद्योगसँग जोडिने, नेतृत्व देखाउने, स्वयंसेवा गर्ने, सहपाठीलाई सहयोग गर्ने र School लाई पढ्न र आफ्नोपन महसुस गर्न अझ राम्रो ठाउँ बनाउने विद्यार्थीहरूलाई पनि सम्मान गरे; Outstanding ICT Project Awards का लागि मात्र 27 वटा मनोनयन आएका थिए।"
    - "चार सर्वोच्च सम्मानले अनुसन्धान उत्कृष्टता, Bachelor of Information and Communication Technology र Master of Information Technology and Systems मा शैक्षिक उत्कृष्टता, र 2026 ICT Graduate of the Year लाई सम्मान गरे, जुन Gazi MD Wasi-UL Hoque Eusha ले पाए। विद्यार्थी आफैंले तय गरेका Students’ Choice Awards मा सबैले मनमनै सोध्न चाहेका प्रश्न सोध्ने विद्यार्थीका लागि Inquisitor Award पनि थियो, र ICT Community Spirit Award Chhunly Chhek ले पाए। साँझमा दुई विद्यार्थी, लन्सेस्टनमा Rakhitha Dassanayake र होबार्टमा Taylah Stewart, ले विद्यार्थी सम्बोधन पनि गरे।"
