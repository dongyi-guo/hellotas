      ne: "AMC Mate टिम परियोजनाको ग्राहक"
    avatar: "/images/events/2026/ict-awards-night/linkedin-amc-search-avatar.jpg"
    images:
      - "/images/events/2026/ict-awards-night/linkedin-amc-search-1.jpg"
    content:
      en: "Congratulations to the UTAS ICT student team on receiving the 'Best Project' Award for their work with AMC Search on the AMC MATE tool."
      zh: "祝贺 UTAS ICT 学生团队凭借与 AMC Search 合作开发的 AMC MATE 工具获得“最佳项目”奖。"
      ne: "AMC Search सँग AMC MATE उपकरणमा गरेको कामका लागि 'Best Project' Award पाउनुभएकोमा UTAS ICT विद्यार्थी टोलीलाई बधाई।"
    summary:
      en: "AMC Search, the client behind AMC Mate, congratulates the student team that won the Outstanding ICT Team Project award for a Complex Integrated Systems Solution. The tool lets maritime students practise answering an avatar's questions for the M45 oral exam, and every team member earned a High Distinction. The Australian Maritime College shared the same post."
      zh: "AMC Mate 的客户 AMC Search 祝贺获得“杰出 ICT 团队项目——复杂集成系统解决方案”奖的学生团队。这个工具让航海专业学生向虚拟形象练习回答 M45 口试的问题，团队每位成员都获得了 High Distinction。Australian Maritime College 也发布了同样的帖子。"
      ne: "AMC Mate को ग्राहक AMC Search ले Complex Integrated Systems Solution का लागि Outstanding ICT Team Project पुरस्कार जित्ने विद्यार्थी टोलीलाई बधाई दिन्छ। यो उपकरणले सामुद्रिक विद्यार्थीहरूलाई M45 मौखिक परीक्षाका लागि अवतारका प्रश्नको उत्तर अभ्यास गर्न दिन्छ, र टोलीका हरेक सदस्यले High Distinction पाए। Australian Maritime College ले पनि यही पोस्ट साझा गर्‍यो।"
