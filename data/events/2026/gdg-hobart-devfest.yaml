summary:
  en: "GDG Hobart's second DevFest session of 2026 at UTAS: a hands-on workshop on Gemini in Android Studio with Kartik Arora (Bilue), then a Looker Studio dashboards masterclass with Cynthia Wilanda (MyState)."
  zh: "GDG Hobart 2026 年在 UTAS 的第二场 DevFest：先由 Kartik Arora（Bilue）带来 Android Studio 中 Gemini 的实操工作坊，再由 Cynthia Wilanda（MyState）讲解如何用 Looker Studio 制作仪表板。"
  ne: "UTAS मा GDG Hobart को 2026 को दोस्रो DevFest सत्र: Kartik Arora (Bilue) सँग Android Studio मा Gemini को व्यावहारिक कार्यशाला, त्यसपछि Cynthia Wilanda (MyState) सँग Looker Studio ड्यासबोर्ड मास्टरक्लास।"
