about:
  en:
    - "GDG Hobart held DevFest 2026: Explore AI-Powered Development & Digital Analytics on Thursday 19 November 2026, from 5:15 PM to 6:45 PM, in Room 132 of the Centenary Building on the University of Tasmania's Sandy Bay campus. It was GDG Hobart's second DevFest session of the year, and with a 62-seat room, RSVPs were capped at 60."
    - "In the first part, Kartik Arora, Lead Engineer at Bilue, ran a hands-on workshop on building Android apps faster with Gemini in Android Studio. Working on a real multi-module project, attendees used Agent Mode to scaffold new features, turned wireframes into Jetpack Compose screens, and tried the Android CLI and automated testing."
    - "In the second part, Cynthia Wilanda, Digital Analytics and Conversion Lead at MyState Limited, showed how to bring data from Google Analytics, Google Play Console and other Google tools into Looker Studio, and turn scattered metrics into clear dashboards for product decisions."
    - "The evening finished with refreshments and time to talk with the speakers, other students and local developers. GDG Hobart thanked UTAS for the venue and its volunteers for running check-in and helping during the workshop."
    - "For UTAS ICT students, it was a practical look at how AI tools are used in real mobile development, and at the analytics skills that product and data roles ask for."
  zh:
    - "GDG Hobart 于 2026 年 11 月 19 日（星期四）下午 5:15 至 6:45，在 University of Tasmania Sandy Bay 校区 Centenary Building 132 室举办了 DevFest 2026：Explore AI-Powered Development & Digital Analytics。这是 GDG Hobart 今年的第二场 DevFest，场地可容纳 62 人，报名人数上限为 60 人。"
    - "第一部分由 Bilue 首席工程师 Kartik Arora 主持实操工作坊，介绍如何借助 Android Studio 中的 Gemini 更快地开发 Android 应用。参与者在一个真实的多模块项目中，用 Agent Mode 搭建新功能、把线框图转成 Jetpack Compose 界面，并尝试了 Android CLI 和自动化测试。"
    - "第二部分由 MyState Limited 数字分析与转化负责人 Cynthia Wilanda 主讲，演示如何把 Google Analytics、Google Play Console 等 Google 工具的数据汇入 Looker Studio，把分散的指标变成清晰的仪表板，帮助做出产品决策。"
    - "活动最后有茶点，大家可以和讲者、其他学生以及本地开发者交流。GDG Hobart 感谢 UTAS 提供场地，也感谢志愿者负责签到并在工作坊中协助。"
    - "对 UTAS ICT 学生来说，这次活动让他们实际了解 AI 工具如何用于真实的移动开发，以及产品和数据岗位需要的数据分析技能。"
  ne:
    - "GDG Hobart ले बिहीबार 19 नोभेम्बर 2026, साँझ 5:15 देखि 6:45 सम्म University of Tasmania को स्यान्डी बे क्याम्पसको Centenary Building को कोठा 132 मा DevFest 2026: Explore AI-Powered Development & Digital Analytics आयोजना गर्‍यो। यो वर्षको GDG Hobart को दोस्रो DevFest सत्र थियो, र 62 सिटको कोठा भएकाले RSVP 60 मा सीमित गरिएको थियो।"
    - "पहिलो भागमा Bilue का Lead Engineer Kartik Arora ले Android Studio मा Gemini प्रयोग गरेर Android एप छिटो बनाउने व्यावहारिक कार्यशाला चलाउनुभयो। सहभागीहरूले वास्तविक multi-module परियोजनामा Agent Mode ले नयाँ फिचर बनाए, wireframe लाई Jetpack Compose स्क्रिनमा बदले, र Android CLI तथा स्वचालित परीक्षण प्रयोग गरे।"
    - "दोस्रो भागमा MyState Limited का Digital Analytics and Conversion Lead Cynthia Wilanda ले Google Analytics, Google Play Console र अन्य Google उपकरणको डेटा Looker Studio मा ल्याएर छरिएका मेट्रिकलाई उत्पादनसम्बन्धी निर्णयका लागि स्पष्ट ड्यासबोर्डमा कसरी बदल्ने भनेर देखाउनुभयो।"
    - "साँझ खाजा र वक्ता, अन्य विद्यार्थी तथा स्थानीय डेभलपरहरूसँग कुराकानीसँगै सकियो। GDG Hobart ले स्थलका लागि UTAS लाई र चेक-इन तथा कार्यशालामा सघाउने स्वयंसेवकहरूलाई धन्यवाद दियो।"
    - "UTAS ICT विद्यार्थीहरूका लागि यो वास्तविक मोबाइल विकासमा AI उपकरण कसरी प्रयोग हुन्छन् र उत्पादन तथा डेटा भूमिकाहरूमा चाहिने एनालिटिक्स सीपबारे व्यावहारिक जानकारी थियो।"
